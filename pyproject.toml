[project]
name = "lumen-lupa-kit"
version = "0.0.1"
description = "Kit abierto de Lumen Lupa: modelo normalizado, adaptador de Stellar (Hubble → DuckDB) con topes de costo, simulador de wash trading con verdad etiquetada y la herramienta del protocolo de revisión."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.5.6",
    "google-cloud-bigquery==3.46.1",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.3",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = [
    "uv_build>=0.8.17,<0.9.0",
]
build-backend = "uv_build"

# La distribución se llama lumen-lupa-kit; el paquete se importa como lumen_lupa.
[tool.uv.build-backend]
module-name = "lumen_lupa"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: consulta datos reales (BigQuery) con credenciales propias; no corre en el CI",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
]
